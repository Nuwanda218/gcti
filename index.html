<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>你的发疯人格是哪一款？</title>
  <meta name="description" content="一个适合课堂展示的表情包人格测试。" />
  <style>
    :root {
      color-scheme: light;
      --ink: #171717;
      --muted: #686b72;
      --paper: #fffaf2;
      --panel: #ffffff;
      --line: #222222;
      --a: #e94b5f;
      --b: #16a085;
      --c: #3f7ac9;
      --d: #f0a323;
      --shadow: 0 14px 30px rgba(26, 26, 26, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
      background:
        linear-gradient(90deg, rgba(23, 23, 23, 0.045) 1px, transparent 1px),
        linear-gradient(0deg, rgba(23, 23, 23, 0.045) 1px, transparent 1px),
        var(--paper);
      background-size: 28px 28px;
      letter-spacing: 0;
      animation: gridDrift 18s linear infinite;
    }

    button {
      font: inherit;
    }

    .shell {
      width: min(1120px, calc(100% - 28px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 22px 0 28px;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 16px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .stamp {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      background: var(--ink);
      color: #fff;
      border: 2px solid var(--ink);
      border-radius: 8px;
      box-shadow: 4px 4px 0 #f0a323;
      transform: rotate(-3deg);
      animation: stampWiggle 2.8s ease-in-out infinite;
      flex: 0 0 auto;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(21px, 4vw, 36px);
      line-height: 1.04;
      letter-spacing: 0;
    }

    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .restart {
      min-width: 44px;
      height: 44px;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      display: grid;
      place-items: center;
      box-shadow: 4px 4px 0 rgba(23, 23, 23, 0.9);
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }

    .restart:hover,
    .restart:focus-visible {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 rgba(23, 23, 23, 0.9);
      outline: none;
    }

    .progress-wrap {
      display: grid;
      gap: 8px;
    }

    .progress-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 14px;
      color: var(--muted);
    }

    .bar {
      height: 12px;
      overflow: hidden;
      border: 2px solid var(--line);
      border-radius: 999px;
      background: #fff;
    }

    .bar > span {
      display: block;
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--a), var(--b), var(--c), var(--d));
      background-size: 240% 100%;
      transition: width 0.28s ease;
      animation: progressRun 1.8s linear infinite;
    }

    main {
      display: grid;
      align-items: center;
    }

    body.is-home .progress-wrap,
    body.is-home .nav {
      display: none;
    }

    .home-view {
      display: none;
      min-height: clamp(560px, 70vh, 720px);
      align-items: center;
      position: relative;
      overflow: hidden;
      border: 2px solid var(--line);
      border-radius: 8px;
      background:
        radial-gradient(circle at 18% 24%, rgba(233, 75, 95, 0.18), transparent 28%),
        radial-gradient(circle at 78% 20%, rgba(22, 160, 133, 0.18), transparent 30%),
        radial-gradient(circle at 62% 86%, rgba(240, 163, 35, 0.2), transparent 32%),
        #fff;
      box-shadow: var(--shadow);
    }

    .home-view.active {
      display: grid;
      animation: rise 0.32s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .home-content {
      position: relative;
      z-index: 2;
      max-width: 760px;
      padding: clamp(24px, 6vw, 54px);
      display: grid;
      gap: 18px;
    }

    .home-kicker {
      width: fit-content;
      padding: 7px 11px;
      border: 2px solid var(--line);
      border-radius: 999px;
      background: #fff;
      font-size: 13px;
      font-weight: 900;
      box-shadow: 3px 3px 0 rgba(23, 23, 23, 0.88);
      transform: rotate(-1.5deg);
    }

    .home-title {
      margin: 0;
      max-width: 720px;
      font-size: clamp(38px, 8vw, 78px);
      line-height: 0.98;
      letter-spacing: 0;
    }

    .home-subtitle {
      margin: 0;
      max-width: 620px;
      font-size: clamp(18px, 3.4vw, 28px);
      line-height: 1.35;
      font-weight: 900;
    }

    .home-copy {
      margin: 0;
      max-width: 620px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.75;
    }

    .home-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .home-tags span {
      padding: 6px 9px;
      border: 2px solid var(--line);
      border-radius: 999px;
      background: #fff;
      font-size: 13px;
      font-weight: 800;
    }

    .start-button {
      width: fit-content;
      min-height: 52px;
      padding: 0 22px;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: var(--ink);
      color: #fff;
      cursor: pointer;
      font-size: 18px;
      font-weight: 900;
      box-shadow: 6px 6px 0 rgba(23, 23, 23, 0.9);
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }

    .start-button:hover,
    .start-button:focus-visible {
      transform: translate(-3px, -3px) rotate(-0.4deg);
      box-shadow: 9px 9px 0 rgba(23, 23, 23, 0.9);
      outline: none;
    }

    .home-stickers {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .note {
      position: absolute;
      padding: 9px 12px;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: #fff;
      font-weight: 900;
      box-shadow: 4px 4px 0 rgba(23, 23, 23, 0.86);
      animation: floatNote 4s ease-in-out infinite;
    }

    .note:nth-child(1) { right: 9%; top: 22%; transform: rotate(4deg); color: var(--a); }
    .note:nth-child(2) { right: 17%; bottom: 22%; transform: rotate(-5deg); color: var(--b); animation-delay: 0.7s; }
    .note:nth-child(3) { left: 46%; top: 12%; transform: rotate(-3deg); color: var(--c); animation-delay: 1.2s; }

    @keyframes floatNote {
      0%, 100% { translate: 0 0; }
      50% { translate: 0 -10px; }
    }

    .question-view,
    .result-view {
      display: none;
    }

    .question-view.active,
    .result-view.active {
      display: grid;
      animation: rise 0.32s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes gridDrift {
      to { background-position: 28px 28px, 28px 28px, 0 0; }
    }

    @keyframes stampWiggle {
      0%, 72%, 100% { transform: rotate(-3deg) scale(1); }
      78% { transform: rotate(4deg) scale(1.06); }
      84% { transform: rotate(-6deg) scale(1.02); }
      90% { transform: rotate(2deg) scale(1.04); }
    }

    @keyframes progressRun {
      from { background-position: 0% 50%; }
      to { background-position: 240% 50%; }
    }

    .question-view.active .question-kicker {
      animation: popTag 0.42s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .question-view.active .question-title {
      animation: titleKick 0.46s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes popTag {
      from { opacity: 0; transform: translateY(10px) rotate(-2deg) scale(0.92); }
      to { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
    }

    @keyframes titleKick {
      from { opacity: 0; transform: translateX(-16px) skewX(-4deg); }
      to { opacity: 1; transform: translateX(0) skewX(0deg); }
    }

    .question-head {
      display: grid;
      gap: 10px;
      margin: 10px 0 18px;
    }

    .question-kicker {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border: 2px solid var(--line);
      border-radius: 999px;
      background: #fff;
      font-size: 13px;
      font-weight: 700;
    }

    .question-title {
      margin: 0;
      font-size: clamp(24px, 5vw, 44px);
      line-height: 1.12;
      max-width: 900px;
      letter-spacing: 0;
    }

    .option-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      align-items: stretch;
    }

    .option {
      position: relative;
      min-height: 0;
      padding: 0;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 5px 5px 0 rgba(23, 23, 23, 0.9);
      cursor: pointer;
      overflow: hidden;
      text-align: left;
      transition: transform 0.16s ease, box-shadow 0.16s ease, filter 0.16s ease;
      animation: cardIn 0.42s cubic-bezier(0.16, 1, 0.3, 1) both;
      animation-delay: var(--delay, 0s);
    }

    .option:hover,
    .option:focus-visible {
      transform: translate(-3px, -3px) rotate(-0.5deg);
      box-shadow: 8px 8px 0 rgba(23, 23, 23, 0.9);
      outline: none;
      filter: saturate(1.05);
    }

    .option.picked {
      animation: pickedPunch 0.34s cubic-bezier(0.2, 1.35, 0.25, 1) both;
      animation-delay: 0s;
      filter: saturate(1.22) contrast(1.04);
    }

    .option.picked .meme-frame img {
      animation: memeBounce 0.42s cubic-bezier(0.2, 1.35, 0.25, 1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(18px) rotate(1.6deg) scale(0.96); }
      to { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
    }

    @keyframes pickedPunch {
      0% { transform: translate(0, 0) scale(1); }
      48% { transform: translate(-5px, -6px) rotate(-1.4deg) scale(1.04); }
      100% { transform: translate(-2px, -2px) rotate(0.2deg) scale(1.01); }
    }

    @keyframes memeBounce {
      0% { transform: scale(1) rotate(0deg); }
      42% { transform: scale(1.1) rotate(-2deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .option[data-choice="A"] .badge,
    .score-row[data-choice="A"] .score-fill {
      background: var(--a);
    }

    .option[data-choice="B"] .badge,
    .score-row[data-choice="B"] .score-fill {
      background: var(--b);
    }

    .option[data-choice="C"] .badge,
    .score-row[data-choice="C"] .score-fill {
      background: var(--c);
    }

    .option[data-choice="D"] .badge,
    .score-row[data-choice="D"] .score-fill {
      background: var(--d);
    }

    .meme-frame {
      position: relative;
      aspect-ratio: 1 / 1;
      display: grid;
      place-items: center;
      padding: 12px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.94), rgba(255, 255, 255, 0.72)),
        repeating-linear-gradient(45deg, rgba(23, 23, 23, 0.05) 0 7px, transparent 7px 14px);
      border-bottom: 2px solid var(--line);
    }

    .meme-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      opacity: 1;
      transition: opacity 0.18s ease;
    }

    .fallback {
      display: none;
      font-size: clamp(58px, 13vw, 110px);
      line-height: 1;
      filter: drop-shadow(4px 5px 0 rgba(23, 23, 23, 0.16));
    }

    .option.image-loading .meme-frame img {
      opacity: 0;
    }

    .option.image-loading .fallback {
      display: block;
    }

    .option.image-missing img {
      display: none;
    }

    .option.image-missing .fallback {
      display: block;
    }

    .badge {
      position: absolute;
      top: 10px;
      left: 10px;
      display: grid;
      place-items: center;
      min-width: 34px;
      height: 34px;
      padding: 0 8px;
      color: #fff;
      border: 2px solid var(--line);
      border-radius: 999px;
      font-weight: 900;
      box-shadow: 2px 2px 0 #fff;
    }

    .option-copy {
      min-height: 112px;
      padding: 12px 13px 14px;
      display: grid;
      gap: 8px;
      align-content: start;
    }

    .option-copy strong {
      font-size: 15px;
      line-height: 1.26;
    }

    .option-copy span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.42;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 48px;
    }

    .ghost {
      height: 42px;
      padding: 0 15px;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-weight: 700;
      cursor: pointer;
      box-shadow: 3px 3px 0 rgba(23, 23, 23, 0.85);
    }

    .ghost:disabled {
      opacity: 0.4;
      cursor: default;
      box-shadow: none;
    }

    .pips {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .pip {
      width: 12px;
      height: 12px;
      border: 2px solid var(--line);
      border-radius: 999px;
      background: #fff;
    }

    .pip.done {
      background: var(--ink);
    }

    .result-view {
      align-items: center;
    }

    .result-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.02fr) minmax(320px, 0.98fr);
      gap: 18px;
      align-items: stretch;
      width: 100%;
    }

    .poster,
    .score-card {
      border: 2px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: var(--shadow);
    }

    .poster {
      overflow: hidden;
    }

    .result-view.active .poster {
      animation: posterSnap 0.58s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .result-view.active .score-card {
      animation: scoreSlide 0.55s 0.08s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .poster.celebrate .poster-sticker img,
    .poster.celebrate .poster-emoji {
      animation: resultWobble 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes posterSnap {
      from { opacity: 0; transform: translateY(24px) rotate(-1deg) scale(0.96); }
      to { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
    }

    @keyframes scoreSlide {
      from { opacity: 0; transform: translateX(22px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes resultWobble {
      0% { transform: scale(0.84) rotate(-6deg); }
      38% { transform: scale(1.12) rotate(4deg); }
      64% { transform: scale(0.98) rotate(-2deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .poster-media {
      min-height: 310px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      background:
        linear-gradient(110deg, rgba(233, 75, 95, 0.18), rgba(22, 160, 133, 0.2), rgba(240, 163, 35, 0.22)),
        #fff;
      border-bottom: 2px solid var(--line);
    }

    .poster-sticker {
      display: grid;
      place-items: center;
      padding: 20px;
      border-right: 2px solid var(--line);
      min-height: 300px;
    }

    .poster-sticker img {
      max-width: min(100%, 300px);
      max-height: 290px;
      object-fit: contain;
      filter: drop-shadow(6px 8px 0 rgba(23, 23, 23, 0.13));
    }

    .poster-sticker .poster-emoji {
      display: none;
      font-size: 118px;
    }

    .poster.image-missing .poster-sticker img {
      display: none;
    }

    .poster.image-missing .poster-emoji {
      display: block;
    }

    .poster-title {
      padding: 24px;
      display: grid;
      align-content: center;
      gap: 12px;
    }

    .poster-title .tag {
      width: fit-content;
      padding: 6px 10px;
      border: 2px solid var(--line);
      border-radius: 999px;
      background: #fff;
      font-weight: 900;
      font-size: 13px;
    }

    .poster-title h2 {
      margin: 0;
      font-size: clamp(34px, 5vw, 56px);
      line-height: 1.02;
      letter-spacing: 0;
    }

    .poster-body {
      padding: 24px;
      display: grid;
      gap: 16px;
    }

    .poster-body p {
      margin: 0;
      font-size: 17px;
      line-height: 1.72;
    }

    .result-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .primary,
    .secondary {
      height: 44px;
      padding: 0 16px;
      border: 2px solid var(--line);
      border-radius: 8px;
      cursor: pointer;
      font-weight: 900;
      box-shadow: 4px 4px 0 rgba(23, 23, 23, 0.9);
    }

    .primary {
      background: var(--ink);
      color: #fff;
    }

    .secondary {
      background: #fff;
      color: var(--ink);
    }

    .score-card {
      padding: 20px;
      display: grid;
      gap: 16px;
      align-content: start;
    }

    .score-card h3 {
      margin: 0;
      font-size: 20px;
    }

    .score-list {
      display: grid;
      gap: 12px;
    }

    .score-row {
      display: grid;
      gap: 6px;
    }

    .score-row header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 14px;
    }

    .score-track {
      height: 16px;
      border: 2px solid var(--line);
      border-radius: 999px;
      overflow: hidden;
      background: #fff;
    }

    .score-fill {
      height: 100%;
      width: 0%;
      transition: width 0.4s ease;
    }

    .answer-strip {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: 7px;
    }

    .answer-chip {
      min-height: 42px;
      display: grid;
      place-items: center;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: #fff;
      font-weight: 900;
    }

    .answer-chip[data-choice="A"] { color: var(--a); }
    .answer-chip[data-choice="B"] { color: var(--b); }
    .answer-chip[data-choice="C"] { color: var(--c); }
    .answer-chip[data-choice="D"] { color: var(--d); }

    .sources {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .sources a {
      color: inherit;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      z-index: 10;
      padding: 10px 14px;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-weight: 800;
      box-shadow: 4px 4px 0 rgba(23, 23, 23, 0.9);
      transform: translate(-50%, 18px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .fx-layer {
      position: fixed;
      inset: 0;
      z-index: 50;
      overflow: hidden;
      pointer-events: none;
    }

    .danmaku-layer {
      position: fixed;
      inset: 0;
      z-index: 4;
      overflow: hidden;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .danmaku-layer.active {
      opacity: 1;
    }

    .danmaku {
      position: fixed;
      left: 100vw;
      top: var(--top, 20vh);
      padding: 7px 13px;
      white-space: nowrap;
      border: 2px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.88);
      color: var(--ink);
      font-weight: 900;
      font-size: var(--font-size, 15px);
      box-shadow: 3px 3px 0 rgba(23, 23, 23, 0.82);
      transform: translateX(0);
      animation: danmakuMove var(--duration, 8s) linear forwards;
    }

    .danmaku[data-tone="A"] { color: var(--a); }
    .danmaku[data-tone="B"] { color: var(--b); }
    .danmaku[data-tone="C"] { color: var(--c); }
    .danmaku[data-tone="D"] { color: var(--d); }

    body.is-result .danmaku {
      opacity: 0.78;
    }

    @keyframes danmakuMove {
      to { transform: translateX(calc(-100vw - 120%)); }
    }

    .spark {
      position: fixed;
      left: var(--x);
      top: var(--y);
      width: var(--size, 9px);
      height: var(--size, 9px);
      border: 2px solid var(--line);
      border-radius: 3px;
      background: var(--spark-color, var(--a));
      box-shadow: 2px 2px 0 rgba(23, 23, 23, 0.18);
      transform: translate(-50%, -50%);
      animation: sparkFly 0.78s cubic-bezier(0.12, 0.72, 0.2, 1) forwards;
    }

    .spark:nth-child(3n) {
      border-radius: 999px;
    }

      danmakuLane += 1;
      item.className = "danmaku";
      item.dataset.tone = tones[Math.floor(Math.random() * tones.length)];
      item.textContent = text;
      item.style.setProperty("--top", `${laneTop}vh`);
      item.style.setProperty("--duration", `${mode === "result" ? 4.8 + Math.random() * 1.6 : 7 + Math.random() * 3}s`);

            <span class="badge">${choice}</span>
            <img src="${memeSets[choice][state.index]}" alt="" loading="lazy" decoding="async" />

          <div class="option-copy">
            <strong>${item.options[choice][0]}</strong>
            <span>${item.options[choice][1]}</span>
          </div>

        img.addEventListener("load", () => {
          option.classList.remove("image-loading");
        }, { once: true });

          option.classList.remove("image-loading");
          option.classList.add("image-missing");
        }, { once: true });
        option.addEventListener("click", () => choose(choice, option));
        optionGrid.append(option);

        img.decoding = "async";
        img.loading = "eager";
        img.src = src;
        preloadCache.set(src, img);
      });
    }

    function updateChrome() {
      const answered = state.answers.filter(Boolean).length;
      const scores = getScores();
      progressText.textContent = state.index < questions.length
        ? `第 ${Math.min(state.index + 1, questions.length)} / ${questions.length} 题`
        : "测试结果";
      progressBar.style.width = `${Math.round((answered / questions.length) * 100)}%`;
      scoreHint.textContent = `A${scores.A} · B${scores.B} · C${scores.C} · D${scores.D}`;
      prevBtn.disabled = state.index === 0 || resultView.classList.contains("active");
      pips.innerHTML = "";

      questions.forEach((_, index) => {
        const pip = document.createElement("span");
        pip.className = `pip${state.answers[index] ? " done" : ""}`;
        pips.append(pip);
      });
    }

    function colorForChoice(choice) {
      return choice === "A" ? "#e94b5f"
        : choice === "B" ? "#16a085"
        : choice === "C" ? "#3f7ac9"
        : "#f0a323";
    }

    function getFxLayer() {
      let layer = document.getElementById("fxLayer");
      if (!layer) {
        layer = document.createElement("div");
        layer.className = "fx-layer";
        layer.id = "fxLayer";
        layer.setAttribute("aria-hidden", "true");
        document.body.append(layer);
      }
      return layer;
    }

    function burstAt(x, y, choice = "D", amount = 18) {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const layer = getFxLayer();
      const colors = [colorForChoice(choice), "#ffffff", "#171717", "#f0a323", "#3f7ac9"];
      for (let i = 0; i < amount; i += 1) {
        const spark = document.createElement("span");
        const angle = (Math.PI * 2 * i) / amount + Math.random() * 0.42;
        const distance = 42 + Math.random() * 86;
        spark.className = "spark";
        spark.style.setProperty("--x", `${x}px`);
        spark.style.setProperty("--y", `${y}px`);
        spark.style.setProperty("--dx", `${Math.cos(angle) * distance}px`);
        spark.style.setProperty("--dy", `${Math.sin(angle) * distance}px`);
        spark.style.setProperty("--rot", `${Math.floor(Math.random() * 520 - 260)}deg`);
        spark.style.setProperty("--size", `${6 + Math.random() * 8}px`);
        spark.style.setProperty("--spark-color", colors[i % colors.length]);
        layer.append(spark);
        spark.addEventListener("animationend", () => spark.remove(), { once: true });
      }
    }

    function burstFromElement(element, choice, amount) {
      const rect = element.getBoundingClientRect();
      burstAt(rect.left + rect.width / 2, rect.top + rect.height / 2, choice, amount);
    }

    function choose(choice, optionElement) {
      if (state.locked) return;
      state.locked = true;
      state.answers[state.index] = choice;
      if (optionElement) {
        optionElement.classList.add("picked");
        burstFromElement(optionElement, choice, 18);
      }
      window.setTimeout(() => {
        if (state.index < questions.length - 1) {
          state.index += 1;
          renderQuestion();
        } else {
          showResult();
        }
        state.locked = false;
      }, 260);
    }

    function calculateResult() {
      const scores = getScores();
      const high = Math.max(scores.A, scores.B, scores.C, scores.D);
      const winners = Object.keys(scores).filter((choice) => scores[choice] === high);
      return { scores, winners, resultKey: winners.length === 1 ? winners[0] : "MIX" };
    }

    function showResult() {
      const { scores, winners, resultKey } = calculateResult();
      const result = results[resultKey];
      document.body.classList.remove("is-home");
      document.body.classList.add("is-result");
      homeView.classList.remove("active");
      questionView.classList.remove("active");
      resultView.classList.add("active");
      resultTitle.textContent = result.title;
      resultTag.textContent = resultKey === "MIX" ? `并列：${winners.join(" / ")}` : result.tag;
      resultDescription.textContent = resultKey === "MIX"
        ? `${result.description} 你的并列项是：${winners.map((choice) => labels[choice]).join("、")}。`
        : result.description;
      resultImage.src = result.image;
      resultImage.alt = result.title;
      resultEmoji.textContent = result.emoji;
      poster.classList.remove("image-missing", "celebrate");
      resultImage.onerror = () => poster.classList.add("image-missing");
      renderScores(scores);
      updateChrome();
      progressText.textContent = "测试结果";
      progressBar.style.width = "100%";
      prevBtn.disabled = true;
      window.setTimeout(() => {
        poster.classList.add("celebrate");
        burstAt(window.innerWidth / 2, Math.min(window.innerHeight * 0.38, 360), resultKey === "MIX" ? "D" : resultKey, 44);
        fireResultDanmaku();
      }, 180);
    }

    function renderScores(scores) {
      answerStrip.innerHTML = "";
      state.answers.forEach((answer, index) => {
        const chip = document.createElement("div");
        chip.className = "answer-chip";
        chip.dataset.choice = answer;
        chip.textContent = `${index + 1}.${answer}`;
        answerStrip.append(chip);
      });

      scoreList.innerHTML = "";
      ["A", "B", "C", "D"].forEach((choice) => {
        const row = document.createElement("div");
        row.className = "score-row";
        row.dataset.choice = choice;
        row.innerHTML = `
          <header><span>${choice} · ${labels[choice]}</span><strong>${scores[choice]} / ${questions.length}</strong></header>
          <div class="score-track"><div class="score-fill" style="width: ${(scores[choice] / questions.length) * 100}%"></div></div>
        `;
        scoreList.append(row);
      });
    }

    function goBack() {
      if (state.index === 0) return;
      state.index -= 1;
      renderQuestion();
    }

    function restart() {
      state.locked = false;
      state.index = 0;
      state.answers = Array(questions.length).fill(null);
      document.body.classList.add("is-home");
      document.body.classList.remove("is-result");
      resultView.classList.remove("active");
      questionView.classList.remove("active");
      homeView.classList.add("active");
      progressBar.style.width = "0%";
      renderQuestion();
      startHomeDanmaku();
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 1500);
    }

    async function copyResult() {
      const { scores, winners, resultKey } = calculateResult();
      const result = results[resultKey];
      const text = `我的发疯人格：${result.title}\n分数：A${scores.A} / B${scores.B} / C${scores.C} / D${scores.D}\n${resultKey === "MIX" ? `并列项：${winners.join("、")}\n` : ""}${result.description}`;
      try {
        await navigator.clipboard.writeText(text);
        showToast("结果已复制");
      } catch (error) {
        showToast("复制失败，长按结果也可以选中");
      }
    }

    prevBtn.addEventListener("click", goBack);
    document.getElementById("startQuiz").addEventListener("click", startQuiz);
    document.getElementById("restartTop").addEventListener("click", restart);
    document.getElementById("restartResult").addEventListener("click", restart);
    document.getElementById("copyResult").addEventListener("click", copyResult);

    renderQuestion();
    startHomeDanmaku();
  </script>
</body>
</html>
